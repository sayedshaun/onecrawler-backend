services:
  postgres:
    image: postgres:16-alpine
    container_name: onecrawler-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onecrawler-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: api
    container_name: onecrawler-migrate
    command: [ "alembic", "upgrade", "head" ]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  fastapi:
    build:
      context: .
      target: api
    container_name: onecrawler-fastapi
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  arq:
    build:
      context: .
      target: worker
    container_name: onecrawler-arq
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mlflow:
    container_name: onecrawler-mlflow
    image: ghcr.io/mlflow/mlflow:v3.14.0
    # --artifacts-destination proxies artifact I/O over the API since the
    # agent container has no direct access to this volume.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow-data/mlflow.db
      --artifacts-destination /mlflow-data/artifacts
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5001
    restart: unless-stopped
    ports:
      - "${MLFLOW_HOST_PORT:-5001}:5000"
    volumes:
      - mlflow-data:/mlflow-data

  agents:
    build:
      context: .
      target: agent
    container_name: onecrawler-agents
    restart: unless-stopped
    ports:
      - "${AGENT_HOST_PORT:-8086}:8086"
    env_file: .env
    environment:
      # POSTGRES_* come from .env — same values fastapi/migrate use, so the
      # agent shares the one Postgres database rather than needing its own.
      AGENT_API_BASE_URL: http://fastapi:8000/api/v1
      AGENT_MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
      fastapi:
        condition: service_started

volumes:
  postgres-data:
  mlflow-data:
