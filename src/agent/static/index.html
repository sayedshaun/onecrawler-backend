<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OneCrawler Agent — Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #1e1f29;
    color: #f8f8f2;
    height: 100vh;
    font-size: 14px;
    display: flex;
    justify-content: center;
  }
  .app {
    max-width: 720px;
    width: 100%;
    height: calc(100vh - 32px);
    margin: 16px 0;
    display: flex;
    flex-direction: column;
    background: #282a36;
    border: 1px solid #44475a;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #44475a; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    position: relative;
    height: 46px;
    flex: 0 0 auto;
    padding: 0 12px;
    border-bottom: 1px solid #44475a;
    display: flex;
    gap: 8px;
    align-items: center;
    background: #21222c;
  }
  header h1 {
    font-size: 13px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #f8f8f2;
  }
  header h1::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #bd93f9;
    box-shadow: 0 0 6px #bd93f9;
  }
  .field {
    background: #21222c;
    border: 1px solid #44475a;
    color: #f8f8f2;
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12.5px;
    transition: border-color 0.15s;
  }
  .field::placeholder { color: #6272a4; }
  .field:focus { outline: none; border-color: #bd93f9; }
  input[name=token] { flex: 1; min-width: 120px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

  .icon-btn {
    background: #21222c;
    border: 1px solid #44475a;
    color: #8892b0;
    border-radius: 7px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    flex: 0 0 auto;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: #343646; color: #f8f8f2; }
  .icon-btn.active { color: #bd93f9; border-color: #bd93f9; }

  #settingsPanel {
    position: absolute;
    top: 52px;
    right: 12px;
    background: #21222c;
    border: 1px solid #44475a;
    border-radius: 10px;
    padding: 12px;
    display: none;
    flex-direction: column;
    gap: 8px;
    width: 220px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    z-index: 10;
  }
  #settingsPanel.open { display: flex; }
  #settingsPanel label {
    font-size: 11.5px;
    color: #6272a4;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  #settingsPanel .row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: #cbd0e8;
    cursor: pointer;
  }

  #jobs {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-bottom: 1px solid #44475a;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 11.5px;
  }
  #jobs:empty { display: none; padding: 0; border: none; }
  .job {
    display: flex;
    align-items: center;
    gap: 5px;
    background: #21222c;
    border: 1px solid #44475a;
    border-radius: 999px;
    padding: 3px 9px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    color: #cbd0e8;
  }
  .job .dot { width: 6px; height: 6px; border-radius: 50%; background: #ffb86c; flex: 0 0 auto; }
  .job[data-status="running"] .dot { background: #8be9fd; animation: pulse 1.2s infinite; }
  .job[data-status="completed"] .dot { background: #50fa7b; }
  .job[data-status="failed"] .dot, .job[data-status="cancelled"] .dot { background: #ff5555; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .msg {
    max-width: 72%;
    padding: 8px 12px;
    border-radius: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 13.5px;
    animation: fadeIn 0.15s ease-out;
  }
  .msg.user { align-self: flex-end; background: #bd93f9; color: #282a36; border-bottom-right-radius: 3px; margin-top: 6px; }
  .msg.agent { align-self: flex-start; background: #343646; border: 1px solid #44475a; color: #f8f8f2; border-bottom-left-radius: 3px; }
  .msg.error { align-self: flex-start; background: #3a2430; border: 1px solid #6b3345; color: #ff6e6e; }
  .msg.meta { align-self: center; font-size: 10.5px; color: #6272a4; background: none; padding: 2px 0; }

  .trace {
    align-self: stretch;
    background: #21222c;
    border: 1px solid #44475a;
    border-radius: 9px;
    padding: 4px 8px;
    font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    max-height: 260px;
    overflow-y: auto;
    color: #cbd0e8;
  }
  .trace .step { padding: 4px 2px; border-bottom: 1px dashed #383a4a; }
  .trace .step:last-child { border-bottom: none; }
  .trace .tag {
    display: inline-block;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 1px 6px;
    border-radius: 999px;
    margin-right: 6px;
  }
  .trace .tag.node { background: #343646; color: #8892b0; }
  .trace .tag.call { background: #4a3a1a; color: #ffb86c; }
  .trace .tag.result { background: #1f3a2a; color: #50fa7b; }
  .trace .tag.ai { background: #1c3a42; color: #8be9fd; }
  .trace pre { margin: 4px 0 0 2px; white-space: pre-wrap; word-break: break-word; opacity: 0.85; }

  form {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid #44475a;
    background: #21222c;
  }
  textarea {
    flex: 1;
    resize: none;
    background: #21222c;
    border: 1px solid #44475a;
    color: #f8f8f2;
    border-radius: 9px;
    padding: 9px 12px;
    font-size: 13.5px;
    font-family: inherit;
    height: 38px;
    max-height: 120px;
    transition: border-color 0.15s;
  }
  textarea::placeholder { color: #6272a4; }
  textarea:focus { outline: none; border-color: #bd93f9; }
  button[type=submit] {
    background: #bd93f9;
    color: #282a36;
    border: none;
    border-radius: 9px;
    padding: 0 16px;
    height: 38px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button[type=submit]:hover:not(:disabled) { background: #a679f5; }
  button[type=submit]:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
  <header>
    <h1>OneCrawler Agent</h1>
    <input class="field" name="token" type="password" placeholder="Bearer token" />
    <button type="button" class="icon-btn" id="settingsToggle" title="Settings">⚙</button>
    <button type="button" class="icon-btn" id="reset" title="New conversation">＋</button>
    <div id="settingsPanel">
      <label>Provider override
        <input class="field" name="provider" placeholder="e.g. openrouter" />
      </label>
      <label>Model override
        <input class="field" name="model" placeholder="e.g. gpt-4o-mini" />
      </label>
      <label class="row">
        <input type="checkbox" id="liveMode" checked /> Live trace
      </label>
    </div>
  </header>
  <div id="jobs"></div>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Ask the agent to crawl, check status, export data…" required></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  </div>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const tokenEl = document.querySelector("input[name=token]");
  const providerEl = document.querySelector("input[name=provider]");
  const modelEl = document.querySelector("input[name=model]");
  const settingsToggle = document.getElementById("settingsToggle");
  const settingsPanel = document.getElementById("settingsPanel");

  let conversationId = crypto.randomUUID();

  settingsToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    settingsPanel.classList.toggle("open");
    settingsToggle.classList.toggle("active", settingsPanel.classList.contains("open"));
  });
  document.addEventListener("click", (e) => {
    if (!settingsPanel.contains(e.target) && e.target !== settingsToggle) {
      settingsPanel.classList.remove("open");
      settingsToggle.classList.remove("active");
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "38px";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  addMsg("conversation " + conversationId.slice(0, 8), "meta");

  document.getElementById("reset").addEventListener("click", () => {
    conversationId = crypto.randomUUID();
    log.innerHTML = "";
    addMsg("conversation " + conversationId.slice(0, 8), "meta");
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  function requestBody(message) {
    return JSON.stringify({
      message,
      conversation_id: conversationId,
      provider: providerEl.value.trim() || null,
      model: modelEl.value.trim() || null,
    });
  }

  function traceStep(node, path, tagClass, tagText, body) {
    const trace = document.getElementById("trace");
    const step = document.createElement("div");
    step.className = "step";
    const label = (path && path.length ? path.join(" › ") + " › " : "") + node;
    step.innerHTML =
      '<span class="tag ' + tagClass + '">' + tagText + '</span>' +
      '<span style="opacity:0.6">' + label + '</span>' +
      (body ? '<pre></pre>' : '');
    if (body) step.querySelector("pre").textContent = body;
    trace.appendChild(step);
    trace.scrollTop = trace.scrollHeight;
    log.scrollTop = log.scrollHeight;
  }

  function renderTraceEvent(evt) {
    const msg = evt.message;
    if (msg.kind === "AIMessage") {
      if (msg.tool_calls && msg.tool_calls.length) {
        for (const tc of msg.tool_calls) {
          traceStep(evt.node, evt.path, "call", tc.name, JSON.stringify(tc.args, null, 2));
        }
      } else if (msg.content) {
        traceStep(evt.node, evt.path, "ai", "message", msg.content);
      }
    } else if (msg.kind === "ToolMessage") {
      traceStep(evt.node, evt.path, "result", msg.name || "result", msg.content);
      trackJobFromToolResult(msg);
    } else {
      traceStep(evt.node, evt.path, "node", msg.kind, msg.content);
    }
  }

  const jobsEl = document.getElementById("jobs");
  const trackedJobs = new Set();

  function trackJobFromToolResult(msg) {
    if (!["create_crawl", "retry_crawl"].includes(msg.name)) return;
    let data;
    try { data = JSON.parse(msg.content); } catch { return; }
    if (!data.id || trackedJobs.has(data.id)) return;
    trackedJobs.add(data.id);
    addJobBadge(data.id, data.status || "queued");
    pollJob(data.id);
  }

  function addJobBadge(jobId, status) {
    const badge = document.createElement("div");
    badge.className = "job";
    badge.dataset.status = status;
    badge.dataset.jobId = jobId;
    badge.innerHTML = '<span class="dot"></span><span class="label"></span>';
    badge.querySelector(".label").textContent = jobId.slice(0, 8) + " · " + status;
    jobsEl.appendChild(badge);
    return badge;
  }

  function updateJobBadge(jobId, status) {
    const badge = jobsEl.querySelector('.job[data-job-id="' + jobId + '"]');
    if (!badge) return;
    badge.dataset.status = status;
    badge.querySelector(".label").textContent = jobId.slice(0, 8) + " · " + status;
  }

  const TERMINAL_STATUSES = ["completed", "failed", "cancelled"];

  async function pollJob(jobId) {
    const token = tokenEl.value.trim();
    while (true) {
      await new Promise((r) => setTimeout(r, 4000));
      let data;
      try {
        const res = await fetch("/api/crawls/" + jobId, {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) continue;
        data = await res.json();
      } catch {
        continue;
      }
      updateJobBadge(jobId, data.status);
      if (TERMINAL_STATUSES.includes(data.status)) {
        addMsg(
          "Crawl " + jobId.slice(0, 8) + " (" + data.targetUrl + ") finished: " + data.status +
            " — " + data.urlsScraped + " scraped, " + data.urlsFailed + " failed.",
          data.status === "completed" ? "meta" : "error"
        );
        return;
      }
    }
  }

  async function sendLive(message, pending) {
    const trace = document.createElement("div");
    trace.className = "trace";
    trace.id = "trace";
    log.insertBefore(trace, pending);

    let currentId = null;
    let currentBubble = null;

    function bubbleFor(id) {
      if (id !== currentId) {
        currentId = id;
        currentBubble = document.createElement("div");
        currentBubble.className = "msg agent";
        log.insertBefore(currentBubble, pending);
      }
      return currentBubble;
    }

    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + tokenEl.value.trim(),
      },
      body: requestBody(message),
    });

    if (!res.ok || !res.body) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail ? JSON.stringify(data.detail) : "Request failed (" + res.status + ")");
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let sawOutput = false;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);

        let eventType = "message";
        let data = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event:")) eventType = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;

        if (eventType === "error") {
          const parsed = JSON.parse(data);
          throw new Error(parsed.error || "stream error");
        }
        if (eventType === "done") continue;

        if (eventType === "token") {
          const evt = JSON.parse(data);
          sawOutput = true;
          bubbleFor(evt.message_id).textContent += evt.delta;
          log.scrollTop = log.scrollHeight;
          continue;
        }

        renderTraceEvent(JSON.parse(data));
      }
    }

    pending.remove();
    if (!sawOutput) addMsg("(no reply)", "agent");
  }

  async function sendPlain(message, pending) {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + tokenEl.value.trim(),
      },
      body: requestBody(message),
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.detail ? JSON.stringify(data.detail) : "Request failed (" + res.status + ")");
    }
    pending.textContent = data.reply;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    const token = tokenEl.value.trim();
    if (!token) {
      addMsg("Enter a bearer token first.", "error");
      return;
    }

    addMsg(message, "user");
    input.value = "";
    input.style.height = "38px";
    send.disabled = true;
    const pending = addMsg("…", "agent");

    try {
      if (document.getElementById("liveMode").checked) {
        await sendLive(message, pending);
      } else {
        await sendPlain(message, pending);
      }
    } catch (err) {
      pending.className = "msg error";
      pending.textContent = "Error: " + err.message;
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
